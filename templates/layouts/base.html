{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Log: {{ block "title" . }}System{{ end }}</title>
    <link rel="stylesheet" href="/static/style.css?v=3.0.4">
</head>
<body>
    <nav>
        <div class="container nav-flex">
            <div style="font-size: 1.2rem; font-weight: bold; color: var(--text-primary);">🌿 The Quest Log</div>
            
            <div class="nav-links">
                <a href="/">Bounty Board</a>
                <a href="/newquest">The Forge</a>
                <a href="/chronicle">The Chronicle</a>
                <a href="/scriptorium">Scriptorium</a>
                <a href="/settings">Settings</a>
            </div>

            {{if .User}}
            <div class="user-identity-badge" style="display: flex; align-items: center; gap: 0.75rem; background: rgba(255, 255, 255, 0.05); padding: 0.35rem 0.85rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <div style="display: flex; flex-direction: column; align-items: center; line-height: 1.2;">
                    <span style="font-size: 1.1rem; display: block; text-align: center;">🧙</span>
                    <span style="font-weight: 600; font-size: 0.8rem; color: var(--text-primary, #e2e8f0); letter-spacing: 0.02em;">{{.User.Name}}</span>
                </div>

                <form action="/logout" method="POST" style="margin: 0; display: flex; align-items: center;">
                    <button type="submit" title="Leave Guild / Sign out" style="background: none; border: none; color: #888; cursor: pointer; padding: 0.2rem; font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='#fca5a5'" onmouseout="this.style.color='#888'">
                        🚪 Leave
                    </button>
                </form>
            </div>
            {{end}}
        </div>
    </nav>

    <main class="container">
        {{ template "content" . }}
    </main>

    <footer>I'm not procrastinating... I'm doing side quests!</footer>
</body>
</html>
{{ end }}
