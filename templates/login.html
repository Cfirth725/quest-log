{{define "content"}}
<div class="login-wrapper" style="max-width: 420px; margin: 4rem auto; padding: 2rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; backdrop-filter: blur(8px);">
    <header class="login-header" style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem;">🛡️ Quest Log</h1>
        <p style="color: var(--text-muted, #888); font-size: 0.95rem;">Select your profile to enter The Forge</p>
    </header>

    {{if .Error}}
        <div class="alert alert-error" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
            <span>{{.Error}}</span>
        </div>
    {{end}}

    <form action="/login" method="POST" class="login-form">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="user_id" style="display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: #aaa;">Participant Profile</label>
            <select name="user_id" id="user_id" class="form-control" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-size: 1rem; outline: none;">
                <option value="" disabled selected>-- Select Profile --</option>
                {{range .Users}}
                    <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="pin" style="display: block; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: #aaa;">
                PIN Credential <small style="text-transform: none; font-weight: normal; opacity: 0.7;">(Leave blank if unconfigured)</small>
            </label>
            <input type="password" name="pin" id="pin" class="form-control" placeholder="••••" maxlength="8" style="width: 100%; padding: 0.75rem 1rem; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; letter-spacing: 0.2em;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; background: #3b82f6; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s;">
            Enter Workspace
        </button>
    </form>
</div>
{{end}}
